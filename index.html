<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prompter">
  <title>Teleprompter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Material Icons "settings" (Apache 2.0) -->
  <svg hidden>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></symbol>
  </svg>

  <!-- Edit view: paste / type the script -->
  <section id="edit-view" class="view" hidden>
    <textarea id="script-input" placeholder="Paste or type your script here…" spellcheck="false"></textarea>
    <nav class="toolbar">
      <button id="paste-btn" type="button">Paste</button>
      <button id="clear-btn" type="button">Clear</button>
      <button type="button" class="settings-btn" aria-label="Settings"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      <button id="done-btn" type="button" class="primary">Prompt ▶</button>
    </nav>
  </section>

  <!-- Prompt view: the teleprompter itself -->
  <section id="prompt-view" class="view" hidden>
    <div id="stage">
      <div id="scroller">
        <div id="script"></div>
      </div>
      <div id="focus-band" aria-hidden="true"></div>
      <div id="status" aria-live="polite"></div>
    </div>
    <nav id="speed-bar" class="toolbar" hidden>
      <button id="slower-btn" type="button">Slower</button>
      <span id="wpm-label">140 wpm</span>
      <button id="faster-btn" type="button">Faster</button>
    </nav>
    <nav class="toolbar">
      <button id="edit-btn" type="button">Edit</button>
      <button id="font-down-btn" type="button" aria-label="Decrease font size">A−</button>
      <button id="font-up-btn" type="button" aria-label="Increase font size">A+</button>
      <button id="reset-btn" type="button">Reset</button>
      <button type="button" class="settings-btn" aria-label="Settings"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      <button id="start-btn" type="button" class="primary">Start</button>
    </nav>
  </section>

  <dialog id="settings">
    <header>
      <h2>Tracking settings</h2>
      <button id="settings-done" type="button" class="primary">Done</button>
    </header>
    <div id="settings-rows"></div>
    <button id="settings-defaults" type="button">Restore defaults</button>
  </dialog>

  <div id="toast" role="alert" hidden></div>

  <script src="app.js"></script>
</body>
</html>
